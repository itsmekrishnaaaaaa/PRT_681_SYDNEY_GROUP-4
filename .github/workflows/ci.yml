# Runs the same checks required before every commit: backend tests, frontend lint and production build.
# The app lives in oraEarn-WebApp/, while .github must sit at the repository root.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oraEarn-WebApp
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Tests run in the Testing environment with an in-memory database, so no PostgreSQL service is needed.
      - name: Test
        run: dotnet test backend/OraEarn.Api.Tests/OraEarn.Api.Tests.csproj --configuration Release

  frontend:
    name: Frontend lint and build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oraEarn-WebApp/frontend
    steps:
      - uses: actions/checkout@v5

      # Vite 8 and oxlint need Node 20.19 or later; "20" resolves to the latest 20.x release.
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: oraEarn-WebApp/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
